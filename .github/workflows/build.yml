name: Build firmware
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:


jobs:
  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: zsa/moonlander/reva
            keymap: oryx
          - keyboard: zsa/moonlander/revb
            keymap: oryx
          - keyboard: zsa/moonlander/reva
            keymap: klayi
          - keyboard: zsa/moonlander/revb
            keymap: klayi

    steps:
    - name: Checkout QMK Firmware
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
        submodules: true

    - name: Setup QMK
      uses: ./.github/actions/setup-qmk

    - name: Build
      id: build
      run: |
        qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }} -e SKIP_GIT=1
